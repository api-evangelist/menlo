aid: menlo
name: Menlo Security
description: >-
  Menlo Security is a cybersecurity company that secures the enterprise browser,
  positioning the browser as the point of control for protecting both human users
  and AI agents. Its cloud-native Secure Enterprise Browser and Menlo Cloud
  Security Platform apply remote browser isolation to prevent zero-day phishing,
  ransomware, and malware from ever reaching the endpoint. The platform spans AI
  agent security and governance, AI Adaptive DLP (data loss prevention), file
  security for downloads and uploads, zero-trust remote access to private
  applications, and threat prevention. Menlo Security is headquartered in
  Mountain View, California and is backed by investors including General Catalyst,
  Vista Equity Partners, JPMorgan, American Express Ventures, and HSBC. Menlo does
  not publish a public developer API or OpenAPI surface; administration is handled
  through its cloud console and a customer support portal.
